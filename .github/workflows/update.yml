# Haalt het nieuws op en zet de site live op Cloudflare.
# Het startsein komt elke 15 minuten van de Cloudflare Worker (worker.js, via workflow_dispatch).
# De GitHub-klok hieronder is alleen reserve: GitHub slaat geplande runs vaak urenlang over.
# Nodig: GitHub-secret CLOUDFLARE_API_TOKEN (zie README.md).
name: update news
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: |
            images.json
            cache.json
          key: news-${{ github.run_id }}
          restore-keys: news-
      - run: node server.mjs --build
      - run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
